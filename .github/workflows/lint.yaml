on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

permissions: read-all

jobs:
  format-check:
    runs-on: ubuntu-latest
    name: clang-format
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check formatting
        run: clang-format-21 --dry-run -Werror src/*.cpp src/*.h

  client:
    runs-on: ubuntu-latest
    name: client
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

  r-lint:
    runs-on: ubuntu-latest
    name: R
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: lintr
          needs: lint

      - name: Lint R code
        run: |
          lints <- lintr::lint_package(
            linters = lintr::linters_with_defaults(
              T_and_F_symbol_linter = lintr::T_and_F_symbol_linter()
            )
          )
          if (length(lints) > 0) {
            print(lints)
            stop("Column lints found")
          }
        shell: Rscript {0}

      - name: Check Rd files for missing value tags
        run: |
          rd_files=$(find man -name '*.Rd' ! -name '*-package.Rd')
          missing=()
          for f in $rd_files; do
            if ! grep -q '\\value' "$f"; then
              missing+=("$f")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing \\value tag in: ${missing[*]}"
            exit 1
          fi
